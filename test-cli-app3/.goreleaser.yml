# Basic GoReleaser configuration template
# See https://goreleaser.com for more options

project_name: testcliapp3

builds:
  - id: testcliapp3
    main: ./main.go
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: 'testcliapp3'

archives:
  - format: tar.gz
    name_template: 'testcliapp3_{{.Version}}_{{.Os}}_{{.Arch}}'

release:
  name_template: 'testcliapp3-{{.Version}}'
  prerelease: auto
